name: Build Android APK

on:
  push:
    branches: [main, 'build/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # The APK carries ~1.5 GB of AI models, and the build makes several copies of them
      # (download cache, assets, merged assets, the APK itself). Remove big preinstalled tools
      # this build never uses so the machine can't run out of disk half way through.
      # The Android SDK (/usr/local/lib/android) is kept: the build needs it.
      - name: Make room on the build machine
        run: |
          echo "Before: $(df -h / | awk 'NR==2 {print $4}') free"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "::notice title=Build machine::$(df -h / | awk 'NR==2 {print $4}') disk free, $(free -m | awk '/^Mem:/ {print $7}') MB memory available"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy (Python inside the app) needs the same Python version on the build machine.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/editor-downloads
          key: downloads-speech-sherpa-1.13.8-brain-qwen3vl2b-llamapy-0.3.36-v1
      - name: Copy the editor into the app
        run: sh .github/scripts/prepare-android.sh
      # Firely's engine (llama.cpp) is compiled for the phone only when its code changes.
      - id: brain-cache
        uses: actions/cache@v5
        with:
          path: android/app/src/main/jniLibs
          key: brain-libs-${{ hashFiles('android/app/src/main/cpp/*.cpp', 'android/app/src/main/cpp/CMakeLists.txt', '.github/scripts/build-brain.sh', '.github/scripts/prepare-android.sh') }}
      - name: Build the on-phone AI engine
        if: steps.brain-cache.outputs.cache-hit != 'true'
        run: sh .github/scripts/build-brain.sh
      - name: Build APK
        working-directory: android
        # Says why in an annotation if it fails, and retries once if the machine (not the code) was the cause.
        run: sh ../.github/scripts/gradle-build.sh assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=2.${{ github.run_number }}
      - name: Name the APK
        run: |
          mkdir -p out
          # mv, not cp: a second 1.9 GB copy only costs disk.
          mv android/app/build/outputs/apk/release/*.apk out/AI-editor-open-source.apk
          ls -la out
          unzip -l out/AI-editor-open-source.apk | grep -E "libbrain|assets/brain" || true
          # GitHub download links allow at most 2 GiB per file.
          size=$(stat -c %s out/AI-editor-open-source.apk)
          [ "$size" -lt 2140000000 ] || { echo "APK is too big for a GitHub download link: $size bytes"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: out/AI-editor-open-source.apk

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: out
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the free AI picture services
        continue-on-error: true
        timeout-minutes: 15
        run: python3 .github/scripts/check-free-ai.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: free-ai-pictures
          path: out/free-ai
      - name: Test on an Android phone emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Firely needs room: the 1.9 GB app, plus its AI unpacked to storage and loaded in memory.
          ram-size: 6144M
          heap-size: 512M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/selftest.sh out/AI-editor-open-source.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: out/test
      - name: Publish test screenshots
        if: always()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: selftest-latest
          name: Latest phone test results
          body: Screenshots and log from the latest automatic test on an Android emulator.
          prerelease: true
          files: out/test/*

  # Publishes as soon as the APK is built; the phone test runs alongside and reports separately.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: out
      # The gh tool streams the ~2 GB file; the release action ran out of room for files this big.
      - name: Publish as a download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          Install this file on your Android phone. Everything runs on the phone itself: no website or server needed.
          All the AI is built in and free: no key, account or subscription. Firely, the app's own thinking AI, runs on your phone and works offline: it understands your typed requests and chat edits, looks at your videos and writes picture ideas. Captions work offline too. AI pictures and AI videos are drawn by a free online picture maker, so they need internet.
          Firely is built on Qwen3-VL (Apache 2.0) and llama.cpp (MIT).
          EOF
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "AI editor open source APK" --notes-file notes.md --latest
          for i in 1 2 3; do gh release upload apk-latest out/AI-editor-open-source.apk --clobber && break; sleep 20; done
          gh release edit apk-latest --title "AI editor open source APK" --notes-file notes.md --latest
          gh release view apk-latest --json assets -q '.assets[] | .name + " " + (.size|tostring)'
