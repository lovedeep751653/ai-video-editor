name: Build Android APK

on:
  push:
    branches: [main, 'build/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy (Python inside the app) needs the same Python version on the build machine.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/editor-downloads
          key: downloads-speech-sherpa-1.13.8-brain-qwen3vl2b-llamapy-0.3.36-v1
      - name: Copy the editor into the app
        run: sh .github/scripts/prepare-android.sh
      # Firely's engine (llama.cpp) is compiled for the phone only when its code changes.
      - id: brain-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: brain-libs-${{ hashFiles('android/app/src/main/cpp/*.cpp', 'android/app/src/main/cpp/CMakeLists.txt', '.github/scripts/build-brain.sh', '.github/scripts/prepare-android.sh') }}
      - name: Build the on-phone AI engine
        if: steps.brain-cache.outputs.cache-hit != 'true'
        run: sh .github/scripts/build-brain.sh
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=2.${{ github.run_number }}
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/AI-editor-open-source.apk
          ls -la out
          unzip -l out/AI-editor-open-source.apk | grep -E "libbrain|assets/brain" || true
          # GitHub download links allow at most 2 GiB per file.
          size=$(stat -c %s out/AI-editor-open-source.apk)
          [ "$size" -lt 2140000000 ] || { echo "APK is too big for a GitHub download link: $size bytes"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/AI-editor-open-source.apk

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: out
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the free AI picture services
        continue-on-error: true
        timeout-minutes: 15
        run: python3 .github/scripts/check-free-ai.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-ai-pictures
          path: out/free-ai
      - name: Test on an Android phone emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Firely needs room: the 1.9 GB app, plus its AI unpacked to storage and loaded in memory.
          ram-size: 6144M
          heap-size: 512M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/selftest.sh out/AI-editor-open-source.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: out/test
      - name: Publish test screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: selftest-latest
          name: Latest phone test results
          body: Screenshots and log from the latest automatic test on an Android emulator.
          prerelease: true
          files: out/test/*

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: out
      - name: Publish as a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AI editor open source APK
          body: |
            Install this file on your Android phone. Everything runs on the phone itself: no website or server needed.
            All the AI is built in and free: no key, account or subscription. Firely, the app's own thinking AI, runs on your phone and works offline: it understands your typed requests and chat edits, looks at your videos and writes picture ideas. Captions work offline too. AI pictures and AI videos are drawn by a free online picture maker, so they need internet.
            Firely is built on Qwen3-VL (Apache 2.0) and llama.cpp (MIT).
          files: out/AI-editor-open-source.apk
          make_latest: true
