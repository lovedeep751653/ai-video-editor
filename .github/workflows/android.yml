name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/AI-editor-open-source.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-editor-open-source-APK
          path: out/AI-editor-open-source.apk
      - name: Publish as a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AI editor open source APK
          body: Install this file on your Android phone, then paste your editor's web address once.
          files: out/AI-editor-open-source.apk
          make_latest: true
